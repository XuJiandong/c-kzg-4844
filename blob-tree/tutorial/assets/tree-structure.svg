<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="tree-title tree-desc">
      <title id="tree-title">The path from element 4103 to the public root</title>
      <desc id="tree-desc">Child slot 7 stores the element hash. Its child commitment C_1 is hashed into top-level slot 1. The public root contains the top-level commitment R and the vector length n. Both levels have 4096 slots.</desc>
      <style>
svg { background: #f7f8f2; font-family: system-ui, -apple-system, sans-serif; }
text { text-anchor: middle; fill: #193b30; font-size: 17px; font-weight: 600; }
text.small { font-size: 14px; font-weight: 400; }
text.light { fill: white; }
.edge { stroke: #557568; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.root { fill: #245741; }
.layer { fill: #e8eee2; stroke: #b9cbb5; }
.selected { fill: #bde4b0; stroke: #65935c; stroke-width: 2; }
.commitment { fill: #e2e6ff; stroke: #9da4c6; }
      </style>
      <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#557568"/></marker></defs>
      <path class="edge" d="M450 90 V125 M450 185 V225 M450 280 V320"/>
      <rect class="root" x="315" y="20" width="270" height="70" rx="12"/>
      <text x="450" y="48" class="light">Public root (R, n)</text>
      <text x="450" y="72" class="light small">R = Commit(top-level blob)</text>
      <rect class="layer" x="80" y="125" width="740" height="60" rx="8"/>
      <rect class="selected" x="335" y="125" width="230" height="60" rx="8"/>
      <text x="205" y="160">… Other top slots …</text>
      <text x="450" y="150">Top-level slot 1</text>
      <text x="450" y="173" class="small">H<tspan baseline-shift="sub" font-size="0.75em">child</tspan>(C<tspan baseline-shift="sub" font-size="0.75em">1</tspan>)</text>
      <text x="690" y="160">4096 slots total</text>
      <rect class="commitment" x="315" y="225" width="270" height="55" rx="8"/>
      <text x="450" y="249">C<tspan baseline-shift="sub" font-size="0.75em">1</tspan> = Commit(child blob)</text>
      <text x="450" y="269" class="small">48-byte compressed G1 point</text>
      <rect class="layer" x="80" y="320" width="740" height="60" rx="8"/>
      <rect class="selected" x="335" y="320" width="230" height="60" rx="8"/>
      <text x="205" y="355">… Other elements …</text>
      <text x="450" y="345">Child slot 7</text>
      <text x="450" y="368" class="small">H<tspan baseline-shift="sub" font-size="0.75em">leaf</tspan>(value)</text>
      <text x="690" y="355">4096 slots total</text>
    </svg>
