<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" role="img" aria-labelledby="title desc">
  <title id="title">199-byte membership proof layout</title>
  <desc id="desc">Varint count and indices take 7 bytes; child commitments take 96 bytes; D and W take 96 bytes. Segment widths are proportional to byte counts.</desc>
  <rect width="900" height="140" fill="#f7f8f2"/>
  <g stroke="#f7f8f2" stroke-width="4">
    <rect x="0" y="58" width="31.66" height="78" fill="#dce1ff"/>
    <rect x="31.66" y="58" width="434.17" height="78" fill="#bde4b0"/>
    <rect x="465.83" y="58" width="434.17" height="78" fill="#dce1ff"/>
  </g>
  <path d="M 15.83 58 V 40 H 50" fill="none" stroke="#193b30"/>
  <g fill="#193b30" font-family="system-ui, -apple-system, sans-serif" font-size="17" text-anchor="middle">
    <text x="140" y="25">Count + indices</text>
    <text x="140" y="47">7 B (varints)</text>
    <text x="248.75" y="88">Child commitments</text>
    <text x="248.75" y="118">96 B</text>
    <text x="682.92" y="88">D + W</text>
    <text x="682.92" y="118">96 B</text>
  </g>
</svg>
