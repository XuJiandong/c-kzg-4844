name: Rust
on:
  push:
    branches:
      - port-riscv
  pull_request:
    branches:
      - port-riscv

jobs:
  tests:
    runs-on: ${{ matrix.host }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Clang and LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 llvm-19
          echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.0-6d653ac
        with:
          toolchain: stable
          targets: ${{ matrix.target }}, riscv64imac-unknown-none-elf

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            ckb-tests

      - name: Install ckb-debugger
        run: |
          curl --fail --location --retry 3 \
            https://github.com/nervosnetwork/ckb-standalone-debugger/releases/download/v1.1.1/ckb-debugger_v1.1.1_x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/ckb-debugger.tar.gz"
          mkdir -p "$RUNNER_TEMP/ckb-debugger"
          tar -xzf "$RUNNER_TEMP/ckb-debugger.tar.gz" -C "$RUNNER_TEMP/ckb-debugger"
          install -m 755 "$RUNNER_TEMP/ckb-debugger/ckb-debugger" "$HOME/.cargo/bin/ckb-debugger"
          ckb-debugger --version

      - name: Test Rust bindings
        run: cargo test --locked

      - name: Test blob-tree
        run: cargo test --manifest-path blob-tree/Cargo.toml --locked

      - name: Test blob-tree verification-only
        run: cargo test --manifest-path blob-tree/Cargo.toml --locked --no-default-features --features verification-only

      - name: Test on CKB-VM
        run: make ckb-test
